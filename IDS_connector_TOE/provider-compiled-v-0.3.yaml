apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /snap/kompose/19/kompose-linux-amd64 convert
    kompose.version: 1.21.0 (992df58d8)
  creationTimestamp: null
  labels:
    io.kompose.service: tc-provider
  name: tc-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tc-provider
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /snap/kompose/19/kompose-linux-amd64 convert
        kompose.version: 1.21.0 (992df58d8)
      creationTimestamp: null
      labels:
        io.kompose.service: tc-provider
    spec:
      containers:
      - image: rdlabengpa/ids_be_data_app:v0.2.5
        imagePullPolicy: ""
        name: be-dataapp-provider
        ports:
        - containerPort: 8083
        - containerPort: 9000
        resources: {}                                                          
        volumeMounts:
        - mountPath: /config            
          name: be-dataapp-provider-claim0
        - mountPath: /data
          name: be-dataapp-provider-claim1
        - name: be-dataapp-provider-claim2
          mountPath: /cert/ssl-server.jks
          subPath: ssl-server.jks
          readOnly: false
          
      - image: rdlabengpa/ids_execution_core_container:v1.11.0
        imagePullPolicy: ""
        name: ecc-provider
        ports:
        - containerPort: 8443  # Changed from 8449 to 8443
        - containerPort: 8081  # Added HTTP port
        - containerPort: 8889
        - containerPort: 8887  # Added Camel sender port
        - containerPort: 8086
        resources: {}
        volumeMounts:
        - mountPath: /config
          name: ecc-provider-claim0
        - mountPath: /cert
          name: ecc-provider-claim1
          
      restartPolicy: Always
      serviceAccountName: ""
      volumes:
      - name: be-dataapp-provider-claim0
        configMap:
          name: be-dataapp-provider-configmap
          optional: false
      - name: be-dataapp-provider-claim1
        persistentVolumeClaim:
          claimName: be-dataapp-provider-claim1
      - name: be-dataapp-provider-claim2
        configMap:
          name: ca-pemstore
          optional: false
      - name: ecc-provider-claim0
        configMap:
          name: ecc-provider-configmap
          optional: false
      - name: ecc-provider-claim1
        configMap:
          name: ca-pemstore
          optional: false

status: {}