openapi: 3.0.3
info:
  title: IDS Connector SDT API
  version: "1.0.0"
  description: |
    API endpoint for the SDT to request data from the IDS Connector (sdt) (consumer).
servers:
  - url: https://10.254.3.188:8004
    description: Local IDSconnector instance (sdt)
paths:
  /api/IDSconnector/get_data_request:
    get:
      summary: SDT gets data from the IDS Connector SDT
      operationId: getDataRequest
      tags: [IDSconnector-sdt]
      parameters:
        - name: toe_id
          in: query
          required: true
          schema:
            type: string
          description: entity to be synchronized with
        - name: data_type
          in: query
          required: true
          schema:
            type: string
          description: Data being received
          example: "json"
        - name: data_path
          in: query
          required: true
          schema:
            type: string
          description: Path to the data source
      responses:
        '200':
          description: Data successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data_response'
              examples:
                example:
                  value:
                    data_type: "json"
                    data: "timestamp,value\n2025-09-30T10:25:00Z,23.4\n"
        '400':
          description: Invalid data_request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                badRequest:
                  value:
                    code: "BAD_REQUEST"
                    message: "data_path is required."
        '404':
          description: Data not found for the given path or TOE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                notFound:
                  value:
                    code: "NOT_FOUND"
                    message: "No data at data_path"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                serverError:
                  value:
                    code: "INTERNAL_ERROR"
                    message: "Unexpected error while fetching data."
  /api/IDSconnector/extract_file:
    get:
      summary: Extract file from a resource
      operationId: extractFile
      tags: [IDSconnector-consumer]
      parameters:
        - name: data_path
          in: query
          required: true
          schema:
            type: string
          description: Path to the data source containing file
        - name: return_format
          in: query
          required: false
          schema:
            type: string
            default: "json"
            enum: ["json", "binary"]
          description: "Response format: 'json' or 'binary'"
      responses:
        '200':
          description: File successfully extracted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file_response'
              examples:
                jsonResponse:
                  value:
                    data: "base64encodeddata..."
                    encoding: "base64"
                    metadata:
                      filename: "document.pdf"
                      mime_type: "application/pdf"
                      size: 1024
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Resource or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                notFound:
                  value:
                    code: "NOT_FOUND"
                    message: "No resource found for data_path: /path/to/resource"
                noFile:
                  value:
                    code: "NO_FILE"
                    message: "No extractable file found in resource: /path/to/resource"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                serverError:
                  value:
                    code: "INTERNAL_ERROR"
                    message: "Error extracting file: Unexpected error"
components:
  schemas:
    data_request:
      type: object
      required: [toe_id, data_type, data_path]
      properties:
        toe_id:
          type: string
          description: Trusted Operational Environment identifier.
          example: "toe-12345"
        data_type:
          type: string
          description: Type of data being requested
          example: "json"
        data_path:
          type: string
          description: Path to the data resource
          example: "/api/path/to/resource"
    data_response:
      type: object
      required: [data_type, data]
      properties:
        data_type:
          type: string
          description: Type of data returned
          example: "json"
        data:
          type: string
          description: The actual data payload
          example: "timestamp,value\n2025-09-30T10:25:00Z,23.4\n"
    file_response:
      type: object
      required: [data, encoding, metadata]
      properties:
        data:
          type: string
          description: Base64 encoded file data
          example: "base64encodeddata..."
        encoding:
          type: string
          description: Encoding type
          example: "base64"
        metadata:
          type: object
          properties:
            filename:
              type: string
              description: Name of the extracted file
              example: "document.pdf"
            mime_type:
              type: string
              description: MIME type of the file
              example: "application/pdf"
            size:
              type: integer
              description: File size in bytes
              example: 1024
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code
          example: "BAD_REQUEST"
        message:
          type: string
          description: Human-readable error message
          example: "data_path is required."
