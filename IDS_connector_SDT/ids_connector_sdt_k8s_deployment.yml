apiVersion: v1
kind: ConfigMap
metadata:
  name: ids-connector-sdt-configmap
data:
  CONSUMER_BASE_URL: "https://tc-consumer:8444"
  SELF_DESCRIPTION_PATH: "/api/selfDescription/"
  CACHE_TTL: "300" # only governs the catalog-URL lookup (catalog_service.py); resource listing itself is never cached, see resource_state_store.py
  REQUEST_TIMEOUT: "30"
  HOST: "0.0.0.0"
  PORT: "8004"
  LOG_LEVEL: "info"
  RELOAD: "false"
  # Resource sync state (resource_state_store.py) - tracks per-resource
  # AVAILABLE/DELIVERED/CONFIRMED/DEAD so "already synced" means SDT
  # actually confirmed ingestion, not just "we handed it out once".
  STATE_FILE: "/data/resource_sync_state.json"
  MAX_DELIVERY_ATTEMPTS: "5"
  DELIVERY_TIMEOUT_SECONDS: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: ids-connector-sdt-secret
type: Opaque
stringData:
  username: admin
  password: password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ids-connector-sdt-state-pvc
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName - binds to the cluster default (local-path on this
  # k3s cluster). Survives pod restarts/recreation, unlike the old
  # in-memory-only cache this replaces.
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-connector-sdt-deployment
  labels:
    app: ids-connector-sdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-connector-sdt
  template:
    metadata:
      labels:
        app: ids-connector-sdt
    spec:
      # fsGroup makes kubelet chown the mounted PVC to gid 1000, which is
      # the appuser group the container runs as (see Dockerfile) - without
      # this the local-path-provisioner volume is root-owned and the
      # non-root container can't write STATE_FILE to it.
      nodeSelector:
        kubernetes.io/hostname: sdtm
      securityContext:
        fsGroup: 1000
      containers:
      - name: ids-connector-sdt
        image: docker.io/allenabishek/ids-connector-sdt:v2.0.4 #if you are pulling from dockerhub, then use: allenabishek/ids-connector-sdt:v1.0.0, local image: ids-connector-sdt:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          protocol: TCP
        volumeMounts:
        - name: state
          mountPath: /data
        env:
        - name: CONSUMER_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: CONSUMER_BASE_URL
        - name: SELF_DESCRIPTION_PATH
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: SELF_DESCRIPTION_PATH
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: CACHE_TTL
        - name: REQUEST_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: REQUEST_TIMEOUT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: LOG_LEVEL
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: ids-connector-sdt-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: ids-connector-sdt-secret
              key: password
        - name: STATE_FILE
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: STATE_FILE
        - name: MAX_DELIVERY_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: MAX_DELIVERY_ATTEMPTS
        - name: DELIVERY_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: DELIVERY_TIMEOUT_SECONDS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        #Probes temporarily disabled to avoid container exiting as soon as it starts (NCSRD VM is has limited CPU capacity)
        #livenessProbe:
         # httpGet:
          #  path: /health
           # port: 8004
          #initialDelaySeconds: 30
          #periodSeconds: 10
          #timeoutSeconds: 5
          #failureThreshold: 3
        #readinessProbe:
         # httpGet:
          #  path: /health
           # port: 8004
          #initialDelaySeconds: 10
          #periodSeconds: 5
          #timeoutSeconds: 3
          #failureThreshold: 3
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: ids-connector-sdt-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ids-connector-sdt-service
spec:
  selector:
    app: ids-connector-sdt
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    #nodePort: 8004
    protocol: TCP
    name: http
