apiVersion: v1
kind: ConfigMap
metadata:
  name: ids-connector-sdt-configmap
data:
  CONSUMER_BASE_URL: "https://tc-consumer:8444"
  SELF_DESCRIPTION_PATH: "/api/selfDescription/"
  CACHE_TTL: "300"
  REQUEST_TIMEOUT: "30"
  HOST: "0.0.0.0"
  PORT: "8004"
  LOG_LEVEL: "info"
  RELOAD: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: ids-connector-sdt-secret
type: Opaque
stringData:
  username: admin
  password: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-connector-sdt-deployment
  labels:
    app: ids-connector-sdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-connector-sdt
  template:
    metadata:
      labels:
        app: ids-connector-sdt
    spec:
      containers:
      - name: ids-connector-sdt
        image: allenabishek/ids-connector-sdt:v2.0.4 #if you are pulling from dockerhub, then use: allenabishek/ids-connector-sdt:v1.0.0, local image: ids-connector-sdt:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          protocol: TCP
        env:
        - name: CONSUMER_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: CONSUMER_BASE_URL
        - name: SELF_DESCRIPTION_PATH
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: SELF_DESCRIPTION_PATH
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: CACHE_TTL
        - name: REQUEST_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: REQUEST_TIMEOUT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ids-connector-sdt-configmap
              key: LOG_LEVEL
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: ids-connector-sdt-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: ids-connector-sdt-secret
              key: password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        #Probes temporarily disabled to avoid container exiting as soon as it starts (NCSRD VM is has limited CPU capacity)
        #livenessProbe:
         # httpGet:
          #  path: /health
           # port: 8004
          #initialDelaySeconds: 30
          #periodSeconds: 10
          #timeoutSeconds: 5
          #failureThreshold: 3
        #readinessProbe:
         # httpGet:
          #  path: /health
           # port: 8004
          #initialDelaySeconds: 10
          #periodSeconds: 5
          #timeoutSeconds: 3
          #failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ids-connector-sdt-service
spec:
  selector:
    app: ids-connector-sdt
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    #nodePort: 8004
    protocol: TCP
    name: http
